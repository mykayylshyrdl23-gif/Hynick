name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and install DisguiseAPI (API module only)
        run: |
          git clone --depth 1 https://github.com/itspinger/DisguiseAPI.git
          cd DisguiseAPI
          mvn -B clean install -DskipTests -pl API -am

      - name: Build Hynick
        run: mvn -B clean package --file pom.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hynick
          path: '**/target/*.jar'
