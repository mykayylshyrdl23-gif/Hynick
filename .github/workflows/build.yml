name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hynick
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Checkout DisguiseAPI
        uses: actions/checkout@v5
        with:
          repository: itspinger/DisguiseAPI
          path: DisguiseAPI

      - name: Install DisguiseAPI
        run: mvn -B install -DskipTests --file DisguiseAPI/pom.xml

      - name: Build with Maven
        run: mvn -B clean package --file Hynick/pom.xml

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Hynick
          path: Hynick/target/*.jar
