name: Build Hynick

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Hynick
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # DisguiseAPI 1.4.0 isn't published publicly, so build it first
      - name: Checkout DisguiseAPI
        uses: actions/checkout@v5
        with:
          repository: itspinger/DisguiseAPI
          path: DisguiseAPI

      - name: Install DisguiseAPI to local Maven repo
        run: mvn -B install -DskipTests --file DisguiseAPI/pom.xml

      - name: Build Hynick
        run: mvn -B clean package --file pom.xml

      - name: Upload Hynick jar
        uses: actions/upload-artifact@v4
        with:
          name: Hynick-jar
          path: Hynick/target/*.jar
          if-no-files-found: error
